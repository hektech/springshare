<style>
    /* latin-ext */
    @font-face {
        font-family: 'Fjalla One';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/fjallaone/v13/Yq6R-LCAWCX3-6Ky7FAFrO96kigt.woff2) format('woff2');
        unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    /* latin */
    @font-face {
        font-family: 'Fjalla One';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/fjallaone/v13/Yq6R-LCAWCX3-6Ky7FAFrOF6kg.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
        --calvin-black-fallback: #000;
        --calvin-black: oklch(15% 0.05 270);
        --calvin-red-fallback: #8c2131;
        --calvin-red: oklch(0.42 0.15 23);
        --calvin-light-red-fallback: #b71c1c;
        --calvin-light-red: oklch(0.5 0.15 23);
        --hekman-light-grey-fallback: #f5f3ef;
        --hekman-light-grey: oklch(0.9646 0.0057 84.57);
        --fjalla: "Fjalla One", sans-serif;
    }

    .calvin-black,
    .calvin-black a,
    .calvin-black a:hover,
    .calvin-black a:focus,
    .calvin-black a:active,
    .calvin-black a:visited {
        color: var(--calvin-black-fallback);
        color: var(--calvin-black);
    }

    .calvin-red,
    .calvin-red a,
    .calvin-red a:hover,
    .calvin-red a:focus,
    .calvin-red a:active,
    .calvin-red a:visited {
        color: var(--calvin-red-fallback);
        color: var(--calvin-red);
    }

    .calvin-red a,
    .calvin-red a:hover,
    .calvin-red a:focus,
    .calvin-red a:active,
    .calvin-red a:visited {
        text-decoration: underline;
        text-decoration-color: var(--calvin-red-fallback);
        text-decoration-color: var(--calvin-red);
    }

    body {
        background-color: var(--hekman-light-grey-fallback);
        background-color: var(--hekman-light-grey);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--fjalla);
    }

    h1 {
        font-size: clamp(2rem, 5vw, 3rem);
    }

    h2 {
        font-size: clamp(1.625rem, 5vw, 2.5rem);
    }

    h3 {
        font-size: clamp(1.4rem, 5vw, 2rem);
    }

    h4 {
        font-size: clamp(1.25rem, 5vw, 1.625rem);
    }

    h5 {
        font-size: clamp(1.125rem, 5vw, 1.4rem);
    }

    h6 {
        font-size: clamp(1rem, 5vw, 1.25rem);
    }

    details>summary {
        cursor: pointer;
    }

    a[target="_blank"]::after {
        content: "\f08e";
        margin: 0 5px;
        display: inline-block;
        font: normal normal normal 14px/1 FontAwesome;
        font-size: inherit;
        text-rendering: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale
    }

    /* remove all manual entries of external-link icon since we are now auto-generating them */
    a>i.fa-external-link {
        display: none;
    }

    a.nav-link {
        color: #8c2131;
        color: var(--calvin-red);
    }

    a,
    a>img,
    a>svg {
        transition: 0.3s;
    }

    a:hover>img,
    a:hover>svg {
        filter: drop-shadow(0px 0px 10px var(--calvin-black));
    }

    .icon-link {
        display: inline-flex;
        gap: .375rem;
        align-items: center;
        text-decoration-color: rgba(var(--bs-link-color-rgb), var(--bs-link-opacity, .5));
        text-underline-offset: .25em;
        backface-visibility: hidden;
    }

    .icon-link>.bi {
        flex-shrink: 0;
        width: 1em;
        height: 1em;
        fill: currentcolor;
        transition: .2s ease-in-out transform;
    }

    .icon-link-hover:hover>.bi,
    .icon-link-hover:focus-visible>.bi {
        transform: var(--bs-icon-link-transform, translate3d(.25em, 0, 0));
    }

    .icon-link {
        text-underline-offset: inherit;
    }

    /* BEGIN header */
    header>nav {
        background: url(https://d2jv02qf7xgjwx.cloudfront.net/customers/726/images/bg-wayfinder-pattern-blue-1per.png) repeat;
    }

    }

    .hek-brand-mobile {

    }

    .hek-brand p a:hover {

    }

    .hek-brand h1 {
        font-family: var(--fjalla);
        font-size: clamp(1.2rem, 7vw, 2.2rem);
        letter-spacing: 3px;
    }

    .hek-brand h1 a {
        text-decoration: none;
    }

    .hek-brand h1 a:hover {
        text-decoration: underline;
    }

    .hek-brand>a>img.univ-logo {
        width: clamp(23px, 3vw, 35px)
    }

    .hek-brand>a>img.sem-logo {

    }

    }

    #header-primo-input {

        height: 2.5em;

        width: 22rem;
        border: 1px solid #333;
        background-color: whitesmoke;
    }

    #header-primo-input:focus {
        background-color: white;
    }

    #header-primo-go {
        position: absolute;
        left: 0.5rem;
        top: 10%;
        color: var(--calvin-red);
    }

    @media (max-width: 767px) {

        #header-primo-input,
        .header-primo-input-wrapper {
            width: 100%;
        }

        .hek-brand h1 {

    /* END header */

    body.s-lg-guide-body div.s-lib-main {

    #s-lib-public-header,

        font-weight: normal;
        margin-top: 3rem;
    }

    .s-lg-tab-content {

        border-radius: 1rem;
        padding: 3rem 1rem;

    .s-lg-tab-content>#s-lg-guide-main,
    .s-lg-tab-content>#s-lg-guide-main #s-lg-col-2.col-md-9 {

    /* boxes */
    .s-lib-box .s-lib-box-title,

    .s-lg-tabs-side .s-lg-boxnav {

    .s-lg-tabs-side .s-lg-boxnav .list-group-item {
        background: none;
    }

    #s-lg-guide-tabs li.nav-item a {
        display: block;
    }

    #s-lg-guide-tabs .list-group-item {
        border: none;
    }

    /*hide page title when there is only 1 page, and box-level nav is selected */
    #s-lg-guide-tabs ul li:only-child.active>a:has(~ ul.list-group) {
        display: none;
    }

    #s-lg-tabs-container .nav-pills>li>a,
    #s-lg-guide-tabs .nav-pills>.active>a.active,

        color: #000;
        color: var(--calvin-black);

    #s-lg-tabs-container .nav-pills>li>a {
        background: none;
    }

    #s-lg-tabs-container .nav-pills>li>a:hover {
        text-decoration: underline;
    }

    #s-lg-guide-tabs>.nav-pills>.active ul a:hover {

        color: var(--calvin-black);
        font-weight: 600;
    }

    #s-lg-tabs-container .nav-pills>.active>a:hover {
        font-weight: normal;

    }

    #side-nav-button {
        margin-bottom: 1rem;
        border: 2px solid;

    }

    #side-nav-button .bi-caret-down-fill {

    }

    #side-nav-button[aria-expanded="true"] .bi-caret-down-fill {

    /* END side nav bar */

    /*BEGIN tabbed box*/
    .s-lib-jqtabs div.tab-content {

        border-top: none;
        box-shadow: 0 8px 6px -6px #e8d3d6;

    ul.nav-tabs>li.nav-item>a.nav-link {

    }

    ul.nav-tabs>li>a:hover,
    ul.nav-tabs>li>a:focus {
        background: linear-gradient(#e8c8cd, transparent);
    }

    ul.nav-tabs>li.nav-item>a.active,
    ul.nav-tabs>li.nav-item>a:focus,
    ul.nav-tabs>li.nav-item>a:hover {
        border: 1px solid #8c2131;
        border-bottom: none;
        color: #000;
        background: linear-gradient(#e8d3d6, var(--hekman-light-grey));
        text-decoration: none;
    }

    /*END tabbed box*/

    /* BEGIN Profile Box */
    .s-lib-profile-container a.fw-bold {
        font-weight: normal !important;
    }

    .s-lib-profile-container .s-lib-profile-email a {
        font-size: 1.5rem;
    }

    .s-lib-profile-container .s-lib-profile-widget button {
        background: #FFFFFF !important;
        border: 1px solid #333333 !important;
        border-radius: 6px !important;
        color: #333333 !important;
        padding: 1rem !important;
        margin-top: 1rem;
        transition: 0.3s;
        font-size: 1.25rem !important;
        margin: 0;
    }

    .s-lib-profile-container .s-lib-profile-widget button:hover {
        background-color: #eee !important;
        ;
    }

    /* END Profile Box */

    /* BEGIN A-Z DATABASES */

    /*make fonts bigger on A-Z databases page */
    #col-search input::placeholder,
    #col-search input,
    .col-subjects input,
    .col-types input,
    .col-vendors input,
    #s-lg-az-filters .select2-selection__choice,
    ul.select2-results__option,
    ul.select2-results__options {
        font-size: 1.25rem !important;
    }

    .select2-container--bootstrap5 .select2-selection--multiple:not(.form-select-sm):not(.form-select-lg) .select2-search__field::placeholder,
    .select2-container--bootstrap5 .select2-selection--multiple:not(.form-select-sm):not(.form-select-lg) .select2-search__field {
        height: 21px;
        font-size: inherit;
    }

    #s-lg-az-cols {
        margin: 0;
    }

    #s-lg-az-cols>#col1 {
        border: 3px solid var(--calvin-red);
        padding: 3rem 2rem;
        border-radius: 1rem;
    }

    /* Base: every option gets an empty checkbox box */
    .select2-container--bootstrap5 .select2-dropdown .select2-results__option::before {
        content: "";
        position: absolute;
        top: 50%;
        right: 1.25rem;
        transform: translateY(-50%);
        height: .9rem;
        width: .9rem;
        box-sizing: border-box;
        border: 2px solid var(--bs-border-color, #ced4da);
        /* outline of box */
        border-radius: 0.15rem;
        /* make it slightly rounded or remove for square */
        background-color: transparent;
    }

    /* Keep options positioned correctly so absolute elements align */
    .select2-container--bootstrap5 .select2-dropdown .select2-results__option {
        position: relative;
        padding-right: 2.25rem;
        /* make room for checkbox */
    }

    /* Selected: draw the checkmark inside */
    .select2-container--bootstrap5 .select2-dropdown .select2-results__option.select2-results__option--selected::after {
        top: 50%;
        display: block;
        position: absolute;
        transform: translateY(-50%);
        height: .75rem;
        width: .75rem;
        content: "";
        mask-repeat: no-repeat;
        mask-position: center;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        background-color: var(--bs-component-hover-color);
        -webkit-mask-image: url(data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 11'%3e%3cpath fill='var%28--bs-component-hover-color%29' d='M4.89557 6.49823L2.79487 4.26513C2.26967 3.70683 1.38251 3.70683 0.857309 4.26513C0.375593 4.77721 0.375593 5.57574 0.857309 6.08781L4.74989 10.2257C5.14476 10.6455 5.81176 10.6455 6.20663 10.2257L13.1427 2.85252C13.6244 2.34044 13.6244 1.54191 13.1427 1.02984C12.6175 0.471537 11.7303 0.471536 11.2051 1.02984L6.06096 6.49823C5.74506 6.83403 5.21146 6.83403 4.89557 6.49823Z'/%3e%3c/svg%3e);
        mask-image: url(data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 11'%3e%3cpath fill='var%28--bs-component-hover-color%29' d='M4.89557 6.49823L2.79487 4.26513C2.26967 3.70683 1.38251 3.70683 0.857309 4.26513C0.375593 4.77721 0.375593 5.57574 0.857309 6.08781L4.74989 10.2257C5.14476 10.6455 5.81176 10.6455 6.20663 10.2257L13.1427 2.85252C13.6244 2.34044 13.6244 1.54191 13.1427 1.02984C12.6175 0.471537 11.7303 0.471536 11.2051 1.02984L6.06096 6.49823C5.74506 6.83403 5.21146 6.83403 4.89557 6.49823Z'/%3e%3c/svg%3e);
        right: 1.25rem;
    }

    .s-lg-az-reset {
        font-size: 1rem;
        margin-right: inherit;
    }

    /*make search filters more evident on A-Z databases page */
    #az-search-col-1>nav {
        background: linear-gradient(to right, #ccc, #eee);
        background: linear-gradient(to right, var(--calvin-red), #eee);
    }

    #s-lg-az-filters {
        padding: 0.5rem 1rem;
    }

    div#col-search:before {
        content: "\f002";
        font-family: FontAwesome;
        margin: auto;
    }

    div#s-lg-az-filter-cols button.btn-primary {
        max-width: none !important;
        background-color: var(--calvin-red);
        border: 1px solid;
        padding: 0;
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
    }

    div#s-lg-az-filter-cols button.btn-primary:before {
        content: "\f002";
        font-family: FontAwesome;
        margin: auto;
    }

    #s-lg-az-filter-cols button {
        font-size: 1.33rem;
    }

    /* hide featured and trial descriptions */
    #s-lg-az-popular-body>.accordion-body>p,
    #s-lg-az-trials-body>.accordion-body>p {
        display: none;
    }

    /* subject resources sub-headings */
    #s-lg-az-subject-resources-body h2.mb-4 {
        font-size: 1.325rem;
    }

    /* END A-Z DATABASES */

    /* BEGIN Footer */
    .s-lib-footer {
        background: linear-gradient(45deg, rgba(128, 128, 128, .2) 50%, rgba(128, 128, 128, .15) 50% 100%), url("https://d2jv02qf7xgjwx.cloudfront.net/customers/726/images/bg-wayfinder-pattern-blue-1per.png") repeat;
    }

    footer.hekman-footer {
        background: var(--calvin-red-fallback);
        background: var(--calvin-red);
        background: linear-gradient(45deg, oklch(0.3541 0.1253 23), var(--calvin-red), oklch(0.4806 0.1771 23));
    }

    footer.hekman-footer,
    footer.hekman-footer a,
    footer.hekman-footer a:hover,
    footer.hekman-footer h2,
    footer.hekman-footer p,
    footer.hekman-footer address {
        color: white;
        text-decoration-color: white;
    }

    footer.hekman-footer svg,
    footer.hekman-footer img {
        vertical-align: inherit;
    }

    footer.hekman-footer .hek-socials {
        list-style-type: none;
        padding: 0;

    footer.hekman-footer .hek-socials svg {
        width: 2em;
        height: 2em;
    }

    footer.hekman-footer .hek-socials>li {
        display: inline-block;
    }

    /* END Footer */

    /* subject guides */

    .primo-lg-widget input[type="text"] {
        width: 100%;
        max-width: 40rem;
    }

    div.database-box li.s-lg-tn-li>div>a {
        font-size: 1.5rem;
    }

    /*libcal schedule button*/
    .libcal-schedule-button {
        background: #FFFFFF;
        border: 1px solid #333333;
        border-radius: 4px;
        color: #333333;
        padding: 0.5rem 1rem;
        cursor: pointer;
        margin-top: 1rem;
        transition: 0.3s;
    }

    .libcal-schedule-button:hover,
    .libcal-schedule-button:active,
    .libcal-schedule-button:focus {

    /* Miscellaneous */

    /* Add smoother transitions */
    @view-transition {
        navigation: auto;
    }

    nav#hekman-page-header {
        view-transition-name: --persist-nav;
    }

    div#s-lg-tabs-container {
        view-transition-name: --persist-side-nav;
    }

    /*scrollbar */
    html {
        scrollbar-color: var(--calvin-univ-black) transparent;
    }

    /* BEGIN desktop */
    @media(min-width:992px) {

        /* side nav panel */
        div#s-lg-side-nav-content>div.row>div.col-md-3.s-lg-tabs-side {
            position: sticky;
            top: 0;
            max-height: 100vh;
            max-height: 100dvh;
            overflow-y: auto;
        }

    /* END desktop */

    /* BEGIN tablet and bigger */

    @media (min-width:768px) {
        #s-lg-guide-tabs {
            display: block;
        }

        #side-nav-button {
            display: none;
        }

        }

    /* BEGIN mobile */
    @media (max-width: 767px) {

        footer.hekman-footer {
            text-align: center;
        }
    }

    /* END mobile */

        background: linear-gradient(to right, #ccc, #eee);
        background: linear-gradient(to right, var(--calvin-red), #eee);
