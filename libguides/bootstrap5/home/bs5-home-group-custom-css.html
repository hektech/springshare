<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
<style>
    body {
        font-family: 'Montserrat', Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    .hek-brand {
        font-family: var(--fjalla);
        display: flex;
    }

    .hek-brand-mobile {
        display: none;
    }

    .hek-brand p,
    .hek-brand p a {
        text-decoration: none;
        font-size: 0.85rem;
    }

    .hek-brand p a:hover {
        text-decoration: underline;
    }

    .hek-brand h1 {
        font-family: var(--fjalla);
        font-size: clamp(1.2rem, 7vw, 2.2rem);
        letter-spacing: 3px;
    }

    .hours {
        text-align: right;
    }

    header>nav {
        background: linear-gradient(45deg, rgba(128, 128, 128, .2) 370px, rgba(128, 128, 128, .15) 370px 100%), url("https://d2jv02qf7xgjwx.cloudfront.net/customers/726/images/bg-wayfinder-pattern-blue-1per.png") repeat;
    }

    header>nav .utilities>a {
        background-color: var(--calvin-red-fallback);
        background-color: var(--calvin-red);
        color: white;
        padding: 0.25rem 0.5rem;
    }

    header>nav .utilities>a:hover,
    header>nav .utilities>a:focus,
    header>nav .utilities>a:active {
        color: white;
    }

    .site-search-container {
        border: 1px solid #bbb;
        background-color: #faf9f7;
        background-color: var(--hekman-light-grey);
    }

    .site-search-button,
    .site-search-input {
        border: none;
        background: none;
    }

    .site-search-button {
        padding: 0 0 0 .66rem;
        position: absolute;
    }

    .site-search-input {
        padding-left: 1.85rem;
    }

    .site-search-input::placeholder {
        color: #333 !important;
    }

    #s-lg-guide-header {
        display: none;
    }

    main {
        background-size: cover;
        background-repeat: no-repeat;
    }

        background-color: oklch(0.3647 0.1406 17.56 / 0.75);

    }

    .search-header-title {

        text-align: center;
    }

        height: 4.5rem;
    }

        justify-content: center;
    }

    search.simple-primo-search-wrapper {
        flex: auto;
        max-width: 45rem;
    }

    form#simple-primo-search {
        position: relative;
    }

    #primoQueryTemp {

        width: 100%;
        height: 2.5em;

        border: 1px solid #333;
        border: 1px solid var(--calvin-black);

    }

    input#primoQueryTemp::placeholder {
        color: #222 !important;
    }

        font-size: 1.5rem;
        font-size: clamp(1.4rem, 2vw, 1.75rem);

        z-index: 10;
        left: 2rem;
        top: 32%;

        padding: 20px;

        font-weight: normal;
        margin-bottom: 2rem;
    }

    .home-quick-links ul {
        list-style-type: none;
        padding: 0;

        font-weight: normal;

        padding: 0;

    }

        border: 1px solid #8c2131;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
    }

    .special-collections li>a:hover,
    .special-collections li>a:focus,
    .special-collections li>a:active,

        text-decoration-color: var(--calvin-red-fallback);
        text-decoration-color: var(--calvin-red);
    }

        .hours {
            text-align: center;
            margin-bottom: 1rem;
        }
    }

        .navbar-collapse.collapse.show {
            margin-top: 1rem;
        }


        header>nav {
            background: none;
        }

        .hek-brand {
            display: none;
        }

        .hek-brand-mobile {
            display: flex;
            gap: 0.5rem;
        }

        .hek-brand-mobile svg,
        .hek-brand-mobile img {
            width: 100px;
            height: auto;
        }

        main,
        .main-img-shading {
            background: none;
        }

        .search-header {
            padding-top: 0;
        }

        .search-header svg {
            width: 25px;
            margin-right: 0.75rem;
            height: auto;
        }

        .search-header-title {
            margin-top: 5rem;

            text-shadow: none;

            padding-bottom: 1rem;
